<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Donghyun Kim" />
    <meta
      name="description"
      content="Donghyun Kim — Ph.D. student in Artificial Intelligence at Ajou University. Machine learning, Vision-Language-Action models, and embodied AI."
    />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101315" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://dh58319.github.io/" />

    <!-- Apply the saved theme before first paint. Without this the page renders
         with the OS palette and then repaints once React mounts and reads
         localStorage, which flashes for anyone whose choice differs. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* private mode or storage disabled: fall back to the CSS media query */
        }
      })()
    </script>

    <!-- Fonts are self-hosted and declared in src/styles.css; no third-party
         origin is contacted at runtime. -->

    <!-- Open Graph (Facebook, LinkedIn, KakaoTalk) -->
